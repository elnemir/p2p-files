name: development-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check_repository.mjs
      - run: python3 scripts/security_tools.py actionlint -color
      - run: python3 -m unittest discover -s scripts -p test_github_repository.py
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/acceptance.py run check
      - run: python3 scripts/acceptance.py run compatibility
      - run: python3 scripts/acceptance.py run integration
      - run: python3 scripts/acceptance.py run dependencies
      - run: python3 scripts/acceptance.py run fuzz
      - run: python3 scripts/acceptance.py run browser
      - run: python3 scripts/acceptance.py run ingress
      - run: python3 scripts/acceptance.py run upgrade
      - run: python3 scripts/acceptance.py run performance
      - run: python3 scripts/acceptance.py run verifier
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-evidence-${{ github.sha }}
          path: .cache/evidence/
          include-hidden-files: true
          retention-days: 14
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/acceptance.py run source
      - run: python3 scripts/acceptance.py run licenses
      - run: python3 scripts/acceptance.py run images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: .cache/evidence/
          include-hidden-files: true
          retention-days: 14
