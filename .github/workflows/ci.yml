name: development-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: filex_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d filex_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      FILEX_TEST_DATABASE_URL: postgres://postgres:local-ci-only@localhost:5432/filex_test?sslmode=disable
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make check
      - run: make test-integration
      - run: make security
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/browsers
      - run: make e2e
