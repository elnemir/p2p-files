version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-compatible:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:15'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      go-compatible:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:45'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'
