http:
  routers:
    api:
      entryPoints: [web]
      rule: PathPrefix(`/api/v1/`)
      priority: 100
      service: api
    web:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      service: web
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8080
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
