name: filex-dev
services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres
    environment:
      POSTGRES_USER: filex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-dev.py first}
      POSTGRES_DB: filex
    volumes:
      - pg_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U filex -d filex]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  redis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.redis
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [backend]
    security_opt: [no-new-privileges:true]
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        FILEX_LICENSE_TRUST: ${FILEX_LICENSE_TRUST:?Configure vendor public trust or an isolated qualification fixture}
        FILEX_RELEASE_TRUST: ${FILEX_RELEASE_TRUST:?Configure release public trust}
        FILEX_RELEASE_METADATA: ${FILEX_RELEASE_METADATA:-}
        FILEX_RELEASE_SOURCE: ${FILEX_RELEASE_SOURCE:-}
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://filex:${POSTGRES_PASSWORD}@postgres:5432/filex?sslmode=disable
      MASTER_KEK: ${MASTER_KEK:?Run scripts/init-dev.py first}
      FILEX_SETUP_TOKEN_HASH: ${FILEX_SETUP_TOKEN_HASH:-}
      FILEX_SETUP_EXPIRES_AT: ${FILEX_SETUP_EXPIRES_AT:-}
      HTTP_ADDR: 0.0.0.0:8080
      INTERNAL_ADDR: 0.0.0.0:9090
      DEV_PAYLOAD_ROOT: /data/payload
      DEV_ARTIFACT_ROOT: /data/artifacts
      DEV_BACKUP_ROOT: /data/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge, backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    volumes:
      - payload_data:/data/payload
      - artifact_data:/data/artifacts
      - backup_data:/data/backups
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        FILEX_LICENSE_TRUST: ${FILEX_LICENSE_TRUST:?Configure vendor public trust or an isolated qualification fixture}
        FILEX_RELEASE_TRUST: ${FILEX_RELEASE_TRUST:?Configure release public trust}
        FILEX_RELEASE_METADATA: ${FILEX_RELEASE_METADATA:-}
        FILEX_RELEASE_SOURCE: ${FILEX_RELEASE_SOURCE:-}
    entrypoint: [filex-worker]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://filex:${POSTGRES_PASSWORD}@postgres:5432/filex?sslmode=disable
      MASTER_KEK: ${MASTER_KEK}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    volumes:
      - payload_data:/data/payload
      - artifact_data:/data/artifacts
      - backup_data:/data/backups
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      FILEX_BRANDING_API_URL: http://api:9090/branding
      NEXT_TELEMETRY_DISABLED: '1'
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
  traefik:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.traefik
    user: '65532:65532'
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/routes.yaml
      - --api.dashboard=false
      - --log.level=ERROR
    volumes:
      - ./routes.yaml:/etc/traefik/routes.yaml:ro
    ports: [127.0.0.1:8090:8080]
    networks: [edge]
    depends_on: [web, api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  edge: {}
  backend:
    internal: true
  egress: {}
volumes:
  pg_data: {}
  payload_data: {}
  artifact_data: {}
  backup_data: {}
